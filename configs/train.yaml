# Demo experiment: small 3D U-Net (~350k parameters) on the hippocampus dataset.
# ~35 min on a 14-core laptop CPU (measured: ~2 s per batch of 4); a few minutes on a GPU.
data_config: configs/data.yaml
preprocessing_config: configs/preprocessing.yaml
model:
  name: unet3d
  in_channels: 1
  num_classes: 3
  base_channels: 8
  depth: 3
training:
  seed: 42
  epochs: 20
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.00001
  num_workers: 0
  device: auto              # auto = CUDA if available, else CPU
  amp: true                 # mixed precision, only applied on CUDA
  max_train_samples: null
  augmentation:
    flip_axes_xyz: [0]      # left-right flip only: anterior/posterior labels depend on the A-P axis
    intensity_scale: 0.1
    intensity_shift: 0.1
    noise_std: 0.05
postprocessing:
  keep_largest_component: true
