[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medimg3d-pipeline"
version = "0.1.0"
description = "Reproducible, traceable 3D medical-image segmentation pipeline (technical demonstration, not a medical device)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "SimpleITK>=2.3",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "scikit-image>=0.22",
    "trimesh>=4.0",
    "pyvista>=0.44",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: needs an OpenGL context (skipped in CI)",
    "slow: end-to-end pipeline run on synthetic data (~20 s on CPU)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# Say it explicitly: otherwise ruff guesses, and the guess differs between machines.
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# PyVista's method decorators confuse mypy ("Missing positional argument self");
# treat it as untyped rather than sprinkling ignores through the viewer.
module = ["pyvista", "pyvista.*"]
follow_imports = "skip"
