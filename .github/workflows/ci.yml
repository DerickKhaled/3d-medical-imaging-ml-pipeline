name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy src

      # Unit tests plus a small end-to-end ML smoke run on synthetic volumes:
      # train (2 epochs, tiny U-Net) -> register -> evaluate -> promote -> infer -> mesh -> trace.
      # No real dataset and no expensive training in CI.
      - name: Tests
        run: pytest -q -m "not gui"
